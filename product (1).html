<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product | Aureus Prime</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/">AUREUS PRIME</a><nav><a href="/">Home</a><a href="/cart.html">Cart</a></nav></header>
<main class="shell">
  <div id="productDetail" class="detail-grid">
    <img data-image alt="Product" class="detail-image">
    <section class="panel">
      <span data-signature class="signature" hidden>AUREUS PRIME SIGNATURE</span>
      <h1 data-name></h1><p data-price class="price"></p><p data-description></p>
      <div data-details class="details"></div>
      <div class="trust"><span>✓ Cash on Delivery Available*</span><span>✓ Return / Exchange: subject to policy</span></div>
      <div class="quantity"><button id="minus" type="button">−</button><input id="quantity" type="number" value="1" min="1" max="20"><button id="plus" type="button">+</button></div>
      <div class="button-row"><button id="addToCart" class="outline-button">Add to Cart</button><button id="buyNow" class="gold-button">Buy Now</button></div>
      <small>*Only where supported by your shipping and returns policy.</small>
    </section>
  </div>
</main>
<script type="module" src="/js/products.js"></script>
</body></html>
